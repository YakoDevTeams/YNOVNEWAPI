name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      # On installe les dépendances pour vérifier que le build passe,
      # mais on ne les enverra pas (voir exclude plus bas)
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy via lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          # Création du script lftp
          cat > deploy.lftp << 'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-protect-data true
          set ftp:ssl-force true
          set mirror:parallel-transfer-count 2
          set net:timeout 30

          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftps://${{ secrets.FTP_SERVER }}

          # La syntaxe est : mirror -R [options] <dossier_local> <dossier_distant>
          # On utilise le chemin absolu du workspace GitHub pour être sûr
          mirror -R --delete --verbose \
            --exclude-glob .git* \
            --exclude-glob .github \
            --exclude-glob node_modules \
            --exclude-glob vendor \
            --exclude-glob tests \
            --exclude-glob .env* \
            --exclude-glob phpunit.xml \
            --exclude-glob README.md \
            --exclude-glob storage/logs \
            --exclude-glob storage/framework/cache \
            --exclude-glob storage/framework/sessions \
            --exclude-glob storage/framework/testing \
            --exclude-glob storage/framework/views \
            ${{ github.workspace }} \
            api.ynovservices.com/

          bye
          EOF

          # Exécution du script
          lftp -f deploy.lftp
